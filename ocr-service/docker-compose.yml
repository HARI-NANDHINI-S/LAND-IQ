services:
  ocr-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: land-iq-ocr:latest
    container_name: land-iq-ocr
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - OCR_API_KEY=${OCR_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - MAX_CONCURRENT_OCR=4
      - MAX_FILE_SIZE_BYTES=26214400
      - MAX_PDF_PAGES=50
    volumes:
      - paddle_cache:/home/appuser/.paddlex
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  paddle_cache:
